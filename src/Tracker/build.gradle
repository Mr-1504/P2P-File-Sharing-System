/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}
dependencies {
    implementation libs.io.netty.netty.all
    implementation libs.com.google.code.gson.gson
    implementation libs.io.github.cdimascio.dotenv.java
    implementation libs.org.bouncycastle.bcprov.jdk18on
    implementation libs.org.bouncycastle.bcpkix.jdk18on
    implementation libs.org.bouncycastle.bcutil.jdk18on

    compileOnly libs.com.google.errorprone.error.prone.annotations
}

group = 'main'
version = '1.0-SNAPSHOT'
description = 'Tracker'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
application {
    mainClass = 'Main'
}
publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
